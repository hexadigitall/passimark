[package]
name = "passimark-desktop"
version = "2.0.0"
description = "Passimark Native Desktop Assessment Simulator & Designer"
authors = ["Hexadigitall Inc."]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

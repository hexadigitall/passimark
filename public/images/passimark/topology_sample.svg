<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="dmzGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="10" y="10" width="780" height="430" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Header -->
  <text x="400" y="42" font-family="Inter, sans-serif" font-size="16" font-weight="bold" fill="#f8fafc" text-anchor="middle">
    ENTERPRISE MULTI-TIER PERIMETER &amp; SEGMENTATION ARCHITECTURE
  </text>
  <text x="400" y="62" font-family="Inter, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
    EXHIBIT TOPOLOGY: SECURITY ZONES &amp; INGRESS CONTROLS
  </text>

  <!-- Connection Spine -->
  <line x1="80" y1="230" x2="720" y2="230" stroke="#334155" stroke-width="4" stroke-dasharray="6,6"/>

  <!-- ZONE 1: Untrusted Internet -->
  <g transform="translate(40, 150)">
    <rect width="130" height="160" rx="10" fill="#1e1e2e" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <rect x="0" y="0" width="130" height="26" rx="8" fill="#ef4444" fill-opacity="0.2"/>
    <text x="65" y="18" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#fca5a5" text-anchor="middle">ZONE 0: UNTRUSTED</text>
    <circle cx="65" cy="75" r="26" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
    <text x="65" y="80" font-family="Inter, sans-serif" font-size="18" fill="#e0e7ff" text-anchor="middle">🌐</text>
    <text x="65" y="125" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Public Internet</text>
    <text x="65" y="142" font-family="Inter, sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">WAN Gateway</text>
  </g>

  <!-- FIREWALL 1 -->
  <g transform="translate(195, 180)">
    <rect width="45" height="100" rx="6" fill="#dc2626" stroke="#f87171" stroke-width="1.5" filter="url(#glow)"/>
    <text x="22" y="55" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 22 55)">EXT FW</text>
  </g>

  <!-- ZONE 2: DMZ (TARGET ZONE) -->
  <g id="dmz-target-zone" transform="translate(265, 120)">
    <!-- Highlight Target Box -->
    <rect width="250" height="220" rx="12" fill="url(#dmzGrad)" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="0" filter="url(#glow)"/>
    <rect x="0" y="0" width="250" height="30" rx="10" fill="#22c55e" fill-opacity="0.2"/>
    <text x="125" y="20" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">
      ZONE 1: PERIMETER DMZ (CLICK HERE)
    </text>

    <!-- Node 1: Reverse Proxy -->
    <rect x="20" y="50" width="100" height="70" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="70" y="80" font-family="Inter, sans-serif" font-size="16" fill="#60a5fa" text-anchor="middle">🛡️</text>
    <text x="70" y="102" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Reverse Proxy</text>
    <text x="70" y="114" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">TLS Termination</text>

    <!-- Node 2: Web App Firewall -->
    <rect x="130" y="50" width="100" height="70" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="80" font-family="Inter, sans-serif" font-size="16" fill="#34d399" text-anchor="middle">🧱</text>
    <text x="180" y="102" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">WAF Cluster</text>
    <text x="180" y="114" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Layer 7 Inspection</text>

    <!-- Node 3: Public Load Balancer -->
    <rect x="50" y="135" width="150" height="55" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="125" y="158" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Public Ingress NLB</text>
    <text x="125" y="172" font-family="Inter, sans-serif" font-size="8" fill="#cbd5e1" text-anchor="middle">Port 443 / 8443 Inbound</text>
  </g>

  <!-- FIREWALL 2 -->
  <g transform="translate(540, 180)">
    <rect width="45" height="100" rx="6" fill="#ea580c" stroke="#fb923c" stroke-width="1.5" filter="url(#glow)"/>
    <text x="22" y="55" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle" transform="rotate(-90 22 55)">INT FW</text>
  </g>

  <!-- ZONE 3: Trusted Corporate LAN / Core DB -->
  <g transform="translate(610, 140)">
    <rect width="150" height="180" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="26" rx="8" fill="#3b82f6" fill-opacity="0.2"/>
    <text x="75" y="18" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#93c5fd" text-anchor="middle">ZONE 2: TRUSTED LAN</text>
    
    <rect x="15" y="45" width="120" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="75" y="68" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">App Cluster</text>
    <text x="75" y="82" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Private Subnet</text>

    <rect x="15" y="110" width="120" height="50" rx="6" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
    <text x="75" y="133" font-family="Inter, sans-serif" font-size="10" font-weight="bold" fill="#f8fafc" text-anchor="middle">Database Tier</text>
    <text x="75" y="147" font-family="Inter, sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Zero Ingress</text>
  </g>

  <!-- Footer Legend -->
  <g transform="translate(40, 395)">
    <circle cx="10" cy="10" r="5" fill="#ef4444"/>
    <text x="25" y="14" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Untrusted Boundary</text>
    <circle cx="180" cy="10" r="5" fill="#22c55e"/>
    <text x="195" y="14" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Demilitarized Zone (DMZ)</text>
    <circle cx="380" cy="10" r="5" fill="#3b82f6"/>
    <text x="395" y="14" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Internal Segment</text>
    <rect x="520" y="5" width="10" height="10" rx="2" fill="#ea580c"/>
    <text x="540" y="14" font-family="Inter, sans-serif" font-size="10" fill="#cbd5e1">Stateful Inspection Firewall</text>
  </g>
</svg>
